# gitleaks config for Tapuziel — keep secrets out of git (v0.47 security phase).
# Runs in CI (.github/workflows/security.yml). Locally: gitleaks detect --config .gitleaks.toml

title = "Tapuziel gitleaks"

[extend]
useDefault = true

# The repo is PUBLIC (2026-09-15). Ben: "my hostinger and account are secrets,
# not public knowledge". These rules make CI refuse the identifiers that once
# sat in the docs — a hosting account id (the hPanel/SSH/FTP login and the
# MySQL user prefix), a *.hostingersite.com temporary hostname (it pins a site
# to that account), and a personal mailbox.
[[rules]]
id = "hostinger-account-id"
description = "Hostinger account id (u + 9 digits, optionally a MySQL suffix) — the hosting login name"
regex = '''\bu[0-9]{9}(_[A-Za-z0-9]+)?\b'''

[[rules]]
id = "hostinger-temp-hostname"
description = "A *.hostingersite.com temporary hostname — ties a site to the hosting account"
regex = '''\b[a-z]+-[a-z]+-[0-9]{6}\.hostingersite\.com\b'''

[allowlist]
description = "Test fixtures, hashes, and generated files that look secret-ish but aren't."
paths = [
  '''node_modules/.*''',
  '''.*\.db$''',
  # Agent-token / auth stores are gitignored; scan should never see them, but be explicit.
  '''config/auth\.json''',
  '''config/agent-tokens\.json''',
  # generated icons / schema (no secrets)
  '''extension/icon.*\.png''',
  '''docs/pzn-schema\.json'''
]
regexes = [
  # our fixture bearer tokens in smoke tests are minted at runtime, not committed,
  # but the "tzk_" prefix is not itself a secret pattern — ignore bare prefixes.
  '''tzk_\.\.\.''',
]
