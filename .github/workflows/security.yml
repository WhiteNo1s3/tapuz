name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    # gitleaks-action lists PR commits via the API — needs pull-requests read
    # (the default token lacks it, causing a 403 "not accessible by integration").
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # gitleaks-action v2 requires the auto-provided token to scan PRs
          # (breaking change; without it the job hard-stops before scanning).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - run: npm run test:pzn
      - run: npm run test:smoke
      - run: node scripts/smoke-registry.js
      - run: node scripts/smoke-wizard.js
