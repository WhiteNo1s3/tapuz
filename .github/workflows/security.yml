name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` is NOT one of the default types (opened, synchronize,
    # reopened) — and without it a DRAFT PR can never auto-merge. What happened
    # on PR #37 (2026-09-20): CI went green while the PR was a draft, automerge
    # fired on that green run and failed with "Pull Request is still a draft
    # (mergePullRequest)", and marking it ready afterwards re-ran nothing. The
    # PR sat green, ready and unmerged until a human re-ran the failed job.
    # Listing the type here makes marking a draft ready run CI again, which is
    # what brings automerge back. The cost is one extra run per draft that is
    # later marked ready; the alternative is a manual click on every one.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    # gitleaks-action lists PR commits via the API — needs pull-requests read
    # (the default token lacks it, causing a 403 "not accessible by integration").
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # gitleaks-action has required the auto-provided token to scan PRs
          # since v2 (without it the job hard-stops before scanning).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci || npm install
      - run: npm run test:pzn
      - run: npm run test:smoke
      - run: node scripts/smoke-registry.js
      - run: node scripts/smoke-wizard.js

  deps:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci || npm install
      # Fail on a HIGH/CRITICAL advisory in a PRODUCTION dependency — what
      # actually ships to a deployed CMS. Dev-only + low/moderate transitive
      # advisories are surfaced but don't block (they'd churn CI on noise the
      # deployed site never runs). The tree is clean today (0 vulns, v1.46);
      # this keeps it that way — a vulnerable prod dep can't slip in unnoticed.
      - name: audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high
      - name: report dev/low advisories (non-blocking)
        run: npm audit || true
