    <rect id="Photo" x="60" y="820" width="400" height="240" rx="16" fill="url(#pattern0_0_1)"/>
    <path id="Card title" d="M84 1093.12H228V1110.4H84Z" fill="#1C1B1F"/>
    <path id="Card body" d="M84 1138.28H332V1149.8H84ZM84 1162.28H284V1173.8H84Z" fill="#4A4A4A"/>
  </g>
  <g id="Card_2" transform="scale(0.851382) translate(460 0)">
    <rect id="Card base_2" x="60" y="820" width="400" height="480" rx="16" fill="white" stroke="#E4DED6"/>
    <rect id="Photo_2" x="60" y="820" width="400" height="240" rx="16" fill="url(#pattern1_0_1)"/>
    <path id="Card title_2" d="M84 1093.12H264V1110.4H84Z" fill="#1C1B1F"/>
    <path id="Card body_2" d="M84 1138.28H228V1149.8H84ZM84 1162.28H284V1173.8H84Z" fill="#4A4A4A"/>
  </g>
  <g id="Card_3" transform="scale(0.851382) translate(920 0)">
    <rect id="Card base_3" x="60" y="820" width="400" height="480" rx="16" fill="white" stroke="#E4DED6"/>
    <rect id="Photo_3" x="60" y="820" width="400" height="240" rx="16" fill="url(#pattern2_0_1)"/>
    <path id="Card title_3" d="M84 1093.12H228V1110.4H84Z" fill="#1C1B1F"/>
    <path id="Card body_3" d="M84 1138.28H236V1149.8H84ZM84 1162.28H228V1173.8H84Z" fill="#4A4A4A"/>
  </g>
  <rect id="Footer" y="1380" width="1440" height="220" transform="scale(0.851382)" fill="#1C1B1F"/>
  <path id="Footer text" d="M60 1484.22H319V1494.3H60Z" fill="#B9B3AC" transform="scale(0.851382)"/>
  <ellipse id="Dot" cx="1380" cy="1490" rx="6" ry="6" transform="scale(0.851382)" fill="#F2B84B"/>
