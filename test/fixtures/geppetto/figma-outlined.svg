<svg width="1226" height="1362" viewBox="0 0 1226 1362" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<!-- Synthetic Figma-style export for the smoke: an invented 1440×1600 landing page capped to 1226×1362 (scale 0.851382).
     The tree is the real export's: first Figma's canvas backdrop at export size, OUTSIDE the frame; then the frame group,
     whose first child is the frame's own background carrying the scale, and whose every child carries that same scale,
     so the numbers inside are design px; the text was exported OUTLINED (paths that kept the layer names). -->
<rect width="1225.99" height="1362.21" fill="#1E1E1E"/>
<g id="Landing page" clip-path="url(#clip0_0_1)">
<rect width="1440" height="1600" transform="scale(0.851382)" fill="white"/>
  <rect id="Header" width="1440" height="96" transform="scale(0.851382)" fill="#F7F3EE"/>
  <path id="Brand" d="M60 39.92H168V57.2H60Z" fill="#1C1B1F" transform="scale(0.851382)"/>
  <g id="Nav" transform="scale(0.851382)">
    <path id="Nav label" d="M1096 42.28H1128V53.8H1096Z" fill="#1C1B1F"/>
    <path id="Nav label_2" d="M1186 42.28H1234V53.8H1186Z" fill="#1C1B1F"/>
    <path id="Nav label_3" d="M1284 42.28H1340V53.8H1284Z" fill="#1C1B1F"/>
  </g>
  <line id="Rule" x1="0" y1="96" x2="1440" y2="96" transform="scale(0.851382)" stroke="#E4DED6"/>
  <rect id="Hero backdrop" y="96" width="1440" height="664" transform="scale(0.851382)" fill="url(#paint0_linear_0_1)"/>
  <rect id="Leaf mark" x="160" y="180" width="40" height="40" transform="scale(0.851382) rotate(45 180 200)" fill="#F2B84B"/>
  <circle id="Sun" cx="1240" cy="220" r="60" transform="scale(0.851382)" fill="#F2B84B" fill-opacity="0.35"/>
  <path id="Heading" d="M504 300.96H936V352.8H504ZM486 380.96H954V432.8H486Z" fill="white" transform="scale(0.851382)"/>
  <path id="Subheading" d="M434 488.16H1006V504H434Z" fill="#D8E6DC" transform="scale(0.851382)"/>
  <g id="Button" transform="scale(0.851382)" filter="url(#filter0_d_0_1)">
    <rect id="Pill" x="632" y="560" width="176" height="56" rx="28" fill="#F2B84B"/>
    <path id="Pill label" d="M666 581.54H774V594.5H666Z" fill="#1C1B1F"/>
  </g>
  <g id="Card" transform="scale(0.851382)">
