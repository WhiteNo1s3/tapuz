<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --orange: #f97316;
      --orange-deep: #ea580c;
      --ink: #431407;
      --muted: #9a6b3f;
      --paper: #fff7ed;
      --card: #ffffff;
      --line: #fed7aa;
      --ok: #16a34a;
      --err: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 380px;
      font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    header {
      background: linear-gradient(135deg, var(--orange), var(--orange-deep));
      color: #fff;
      padding: 14px 16px 12px;
    }
    header h1 { font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
    header p { font-size: .78rem; opacity: .92; margin-top: 2px; }
    main { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }
    .card h2 { font-size: .85rem; margin-bottom: 8px; color: var(--orange-deep); }
    label { display: block; font-size: .74rem; color: var(--muted); margin: 8px 0 3px; }
    input, textarea, select {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      font: inherit;
      background: #fffdf9;
      color: var(--ink);
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--orange); }
    textarea { resize: vertical; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--orange), var(--orange-deep));
      color: #fff;
      font: 700 .92rem system-ui, sans-serif;
      cursor: pointer;
      transition: transform .1s, filter .15s;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: translateY(1px); }
    .btn.ghost {
      background: #fff;
      color: var(--orange-deep);
      border: 1.5px solid var(--line);
    }
    .row { display: flex; gap: 8px; }
    .row .btn { margin-top: 10px; }
    .status { font-size: .78rem; margin-top: 8px; min-height: 1.2em; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .hint { font-size: .72rem; color: var(--muted); margin-top: 6px; }
    details.connect > summary {
      cursor: pointer;
      font-size: .8rem;
      color: var(--muted);
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    details.connect > summary::-webkit-details-marker { display: none; }
    #conn-dot { width: 9px; height: 9px; border-radius: 50%; background: #cbd5e1; flex: none; }
    #conn-dot.on { background: var(--ok); }
    a { color: var(--orange-deep); }
    .result-link {
      display: block;
      margin-top: 8px;
      padding: 9px;
      text-align: center;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      color: var(--ok);
    }
  </style>
</head>
<body>
  <header>
    <h1>🍊 תפוזיאל — מלווה ההעתקה</h1>
    <p>מעתיקים חבילה → מדביקים בצ׳אט שלכם → מדביקים תשובה → דף</p>
  </header>
  <main>
    <div class="card">
      <details class="connect" id="connect-fold">
        <summary><span id="conn-dot"></span><span id="conn-label">חיבור לתפוזיאל</span></summary>
        <label>כתובת האתר</label>
        <input id="base-url" dir="ltr" placeholder="http://localhost:3030">
        <label>טוקן סוכן (יוצרים במסך ״גשר סוכן״)</label>
        <input id="token" dir="ltr" type="password" placeholder="tap_…">
        <button type="button" class="btn ghost" id="btn-connect">שמור ובדוק חיבור</button>
        <div class="status" id="conn-status"></div>
      </details>
    </div>

    <div class="card">
      <h2>1 · מה בונים?</h2>
      <textarea id="brief" rows="3" placeholder="למשל: דף נחיתה לחנות פרחים ברעננה, עם גלריה וטופס"></textarea>
      <label>גודל החבילה</label>
      <select id="pack-size">
        <option value="full">מלאה — לצ׳אטים בתשלום</option>
        <option value="lite">קלה — לחשבון חינמי</option>
      </select>
      <button type="button" class="btn" id="btn-copy">📋 העתק חבילה + המחשבה שלי</button>
      <div class="status" id="copy-status"></div>
      <div class="hint">מדביקים את הכל בצ׳אט (ChatGPT / Claude / Grok / Gemini) ושולחים בעצמכם — אנחנו לא נוגעים באתר שלהם.</div>
    </div>

    <div class="card">
      <h2>2 · התשובה חזרה</h2>
      <textarea id="reply" rows="4" placeholder="מעתיקים את כל תשובת הבוט ומדביקים כאן — אפשר עם הטקסט מסביב"></textarea>
      <button type="button" class="btn" id="btn-create">📥 צור דף מהתשובה</button>
      <div class="status" id="create-status"></div>
      <div id="create-result"></div>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
